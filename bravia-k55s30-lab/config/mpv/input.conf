# A/B keys for the tests in tests/README.md. Each press flips one thing and shows it on screen.
F1 af toggle @dialogue ; show-text "dialogue lift: ${af}"
F2 af toggle @night ; show-text "night compressor: ${af}"
F3 cycle deband
F4 cycle interpolation
F5 cycle-values tone-mapping auto bt.2390 spline st2094-40 clip
F6 cycle-values scale ewa_lanczossharp spline36 bilinear
