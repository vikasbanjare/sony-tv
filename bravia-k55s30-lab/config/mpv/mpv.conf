# mpv settings for playing local files from the MacBook to the K-55S30 over HDMI.
# Run with:  mpv --config-dir=config/mpv <file>
# Or pick a profile:  mpv --config-dir=config/mpv --profile=k55-night <file>
#
# Every line here is a starting point to A/B test (tests/README.md), not a known
# best value for this TV. Only Mac playback is affected: the TV's own apps
# (Netflix, YouTube, Prime) never pass through mpv.

# Renderer: libplacebo (gpu-next) does the scaling, tone mapping and dithering.
vo=gpu-next
hwdec=auto-safe
# Show stats with Shift+i, page 2 shows the colour space and peak brightness in use.

# Scaling for 1080p and lower sources. Compare against the TV's own Reality Creation
# by sending 1080p (Mac at 1920x1080) instead of 4K.
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
dither-depth=auto

# The panel is natively 50 Hz (Sony India spec). display-resample locks playback to the
# refresh rate the Mac sends; set the Mac to 50 Hz for 25/50 fps sources and 24 Hz
# (if offered) for films, rather than leaving it at 60 Hz.
video-sync=display-resample
interpolation=no

# HDR files on an SDR output: libplacebo maps them down. Peak detection per frame.
tone-mapping=auto
hdr-compute-peak=auto

# Banding fix for heavily compressed files. Off by default; F3 toggles it (input.conf).
deband=no

# Audio: the TV's two 10 W speakers get stereo; surround tracks are folded down
# at a safe level instead of clipping.
audio-channels=stereo
audio-normalize-downmix=yes
# Filters below start switched off (the "!"); F1/F2 in input.conf switch them on
# so you can hear the difference at the same volume.
# Dialogue: +3 dB around 2.5 kHz, where speech consonants sit.
af-add=@dialogue:!lavfi=[equalizer=f=2500:t=q:w=1.0:g=3]
# Night: compresses loud peaks so dialogue and explosions are closer in level.
af-add=@night:!lavfi=[acompressor=threshold=-24dB:ratio=3:attack=10:release=250:makeup=2]

[k55-sdr-tv]
profile-desc=Mac sends SDR, TV in Cinema or Professional mode. HDR files are tone-mapped by libplacebo.
target-prim=bt.709
target-trc=bt.1886

[k55-night]
profile-desc=Late night: night compressor and dialogue lift on
af-add=@night:lavfi=[acompressor=threshold=-24dB:ratio=3:attack=10:release=250:makeup=2]
af-add=@dialogue:lavfi=[equalizer=f=2500:t=q:w=1.0:g=3]

[k55-lowbitrate]
profile-desc=Old or heavily compressed files: debanding on
deband=yes
deband-iterations=2
deband-grain=16

[k55-smooth-motion]
profile-desc=Frame blending to compare with the TV's own Motionflow. Expect a softer image.
interpolation=yes
tscale=oversample

[k55-hdr-passthrough-experimental]
profile-desc=UNTESTED on this TV. Tries to send HDR10 over HDMI through macOS EDR.
# mpv's manual lists --cocoa-cb-output-csp as macOS and cocoa-cb only, and lists
# --target-colorspace-hint as Wayland/D3D11/winvk only, so this may not work at all.
# (mpv on Linux or Windows prints "option not found" for the last line; that's expected.)
# Turn on System Settings > Displays > (the TV) > High Dynamic Range first.
# Keep it only if the TV's own signal info (Help or the info button) says HDR10
# while the file plays. If it still says SDR, delete this profile.
target-trc=pq
target-prim=bt.2020
cocoa-cb-output-csp=bt.2100-pq
